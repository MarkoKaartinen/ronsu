version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # svelte-check (the type check) does not support TypeScript 7 yet. Remove this when its peerDependencies
      # for typescript include 7: npm view svelte-check peerDependencies.typescript
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # These depend on each other's major versions (a plugin needs a matching Vite), so they come as one pull request
      vite:
        patterns:
          - vite
          - vite-plugin-*
          - "@sveltejs/vite-plugin-*"
      # A package goes in the first group it matches, so this one stays below the Vite group.
      # Minor and patch updates of everything else come as one pull request, as some packages release every few days
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
