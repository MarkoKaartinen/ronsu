name: CI

on:
  pull_request:
  push:
    branches: [main]

# The token can only read the repository: nothing here publishes or writes anything
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, unit tests, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a commit (the tag is in the comment); Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Locked install, and no install scripts of the dependencies are run
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The browser tests use the Google Chrome that is installed on the runner (playwright.config.ts: channel 'chrome')
      - run: npm run test:e2e
