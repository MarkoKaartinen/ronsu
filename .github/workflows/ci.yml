name: CI

on:
  pull_request:
  push:
    branches: [main]

# The token can only read the repository: nothing here publishes or writes anything
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, unit tests, build, browser tests
    runs-on: ubuntu-latest
    # Playwright's own image has Chromium and its system libraries in it, so nothing is installed with apt (a slow
    # package mirror once held a run up for 13 minutes). The tag is the version of @playwright/test in
    # package-lock.json and must change with it; the digest pins the image like the actions below are pinned.
    # --ipc=host: Chromium can run out of memory without it. --user 1001: the runner's user, who owns the workspace.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host --user 1001
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a commit (the tag is in the comment); Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Locked install, and no install scripts of the dependencies are run
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The browser tests use Playwright's own Chromium (the same on every platform, also ARM64)
      - run: npm run test:e2e
